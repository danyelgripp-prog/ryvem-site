# cache-bust: 54b4368
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Páginas legais — HTML estático (legível por crawlers sem JS)
    location = /politica-de-privacidade { try_files /politica-de-privacidade.html =404; }
    location = /termos-de-uso { try_files /termos-de-uso.html =404; }
    location = /politica-de-cookies { try_files /politica-de-cookies.html =404; }
    location = /conformidade-lgpd { try_files /conformidade-lgpd.html =404; }
    location = /acessibilidade { try_files /acessibilidade.html =404; }
    location = /dpa { try_files /dpa.html =404; }
    location = /data-deletion { try_files /data-deletion.html =404; }
    location = /missao-visao-valores { try_files /index.html =404; }

    # SPA fallback
    location / { try_files $uri $uri/ /index.html; }
}
